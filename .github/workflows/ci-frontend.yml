name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: 依存関係インストール
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
